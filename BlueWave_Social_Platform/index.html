<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="BlueWave — a modern social network.">
<title>BlueWave — Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="toast" class="toast" hidden></div>

<section id="authView" class="auth-screen">
  <div class="auth-card">
    <div class="brand brand-auth"><span class="brandmark">B</span><span>BlueWave</span></div>
    <div class="auth-copy">
      <p class="eyebrow">YOUR PEOPLE. YOUR WAVE.</p>
      <h1 id="authTitle">Welcome back.</h1>
      <p id="authSub">Log in with your email and password.</p>
    </div>
    <form id="authForm" novalidate>
      <div id="displayField" class="field hidden"><label for="displayName">Display name</label><input id="displayName" maxlength="60" autocomplete="name" placeholder="Mintu Jaat"></div>
      <div id="usernameField" class="field hidden"><label for="username">Username</label><input id="username" minlength="3" maxlength="24" autocomplete="username" placeholder="mintu"></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="••••••••"></div>
      <button id="authBtn" class="btn btn-primary btn-lg" type="submit">Log in</button>
    </form>
    <p class="auth-switch"><span id="switchText">New here?</span> <button id="switchAuth" class="link-btn" type="button">Create account</button></p>
  </div>
</section>

<section id="appView" class="app hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <button id="mobileBrand" class="brand brand-button"><span class="brandmark">B</span><span>BlueWave</span></button>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="globalSearch" class="search-input" placeholder="Search people..." autocomplete="off">
        <div id="searchResults" class="search-results hidden"></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" data-page="notifications" title="Notifications">♢<span id="notifDot" class="dot hidden"></span></button>
        <button class="icon-btn" data-page="messages" title="Messages">✉</button>
        <button class="profile-mini" data-page="profile"><span id="miniAvatar" class="avatar avatar-sm"></span><span id="miniName"></span></button>
      </div>
    </div>
  </header>

  <div class="app-grid">
    <aside class="sidebar left-sidebar">
      <nav class="side-nav">
        <button data-page="home" class="nav-item active"><span>⌂</span><b>Home</b></button>
        <button data-page="explore" class="nav-item"><span>⌕</span><b>Explore</b></button>
        <button data-page="notifications" class="nav-item"><span>♢</span><b>Notifications</b></button>
        <button data-page="messages" class="nav-item"><span>✉</span><b>Messages</b></button>
        <button data-page="profile" class="nav-item"><span>◎</span><b>Profile</b></button>
        <button data-page="bookmarks" class="nav-item"><span>🔖</span><b>Bookmarks</b></button>
      </nav>
      <button id="createPostSide" class="btn btn-primary btn-wide">Create post</button>
      <button id="logoutBtn" class="nav-item logout-btn"><span>↪</span><b>Log out</b></button>
    </aside>

    <main class="main-column">
      <div id="mainContent">
        <section id="pageHome" class="page">
          <div class="page-head"><div><p class="eyebrow">HOME</p><h2>Your feed</h2></div><button id="refreshFeed" class="icon-btn">↻</button></div>
          <section class="composer card">
            <div class="composer-top"><span id="composerAvatar" class="avatar"></span><textarea id="postText" maxlength="1000" placeholder="What’s happening?"></textarea></div>
            <div id="composePreview" class="compose-preview hidden"></div>
            <div class="composer-bottom"><label class="upload-btn">▧ Photo<input id="postFile" type="file" accept="image/*"></label><span class="muted" id="charCount">0/1000</span><button id="publishPost" class="btn btn-primary">Post</button></div>
          </section>
          <section id="feedList" class="stack"></section>
        </section>

        <section id="pageExplore" class="page hidden"><div class="page-head"><div><p class="eyebrow">EXPLORE</p><h2>Discover</h2></div></div><div id="exploreList" class="stack"></div></section>
        <section id="pageNotifications" class="page hidden"><div class="page-head"><div><p class="eyebrow">UPDATES</p><h2>Notifications</h2></div><button id="markNotifications" class="btn btn-ghost">Mark read</button></div><div id="notificationsList" class="stack"></div></section>
        <section id="pageBookmarks" class="page hidden"><div class="page-head"><div><p class="eyebrow">SAVED</p><h2>Bookmarks</h2></div></div><div id="bookmarksList" class="stack"></div></section>

        <section id="pageProfile" class="page hidden">
          <div id="profileCard" class="profile-card card"></div>
          <div class="profile-tabs"><button class="tab active" data-profile-tab="posts">Posts</button><button class="tab" data-profile-tab="followers">Followers</button><button class="tab" data-profile-tab="following">Following</button></div>
          <div id="profileBody" class="stack"></div>
        </section>

        <section id="pageMessages" class="page hidden">
          <div id="messagesListView"><div class="page-head"><div><p class="eyebrow">PRIVATE</p><h2>Messages</h2></div></div><div id="conversationList" class="stack"></div></div>
          <div id="chatView" class="chat-view hidden">
            <div class="chat-head"><button id="chatBack" class="icon-btn">←</button><span id="chatAvatar" class="avatar avatar-sm"></span><div><strong id="chatName"></strong><div id="chatUsername" class="muted"></div></div></div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-composer"><label class="upload-btn">▧<input id="chatFile" type="file" accept="image/*"></label><input id="chatText" class="chat-input" placeholder="Write a message..."><button id="sendChat" class="btn btn-primary icon-send">➤</button></div>
          </div>
        </section>
      </div>
    </main>

    <aside class="sidebar right-sidebar">
      <section class="card side-card"><div class="side-card-head"><h3>Who to follow</h3><button data-page="explore" class="link-btn">See all</button></div><div id="suggestions"></div></section>
      <section class="card side-card"><div class="side-card-head"><h3>Trending</h3><span class="muted">Today</span></div><div id="trends"></div></section>
      <section class="right-footer"><span>© 2026 BlueWave</span><span>Community</span><span>Privacy</span></section>
    </aside>
  </div>

  <nav class="mobile-nav">
    <button data-page="home" class="active">⌂<span>Home</span></button><button data-page="explore">⌕<span>Explore</span></button><button id="mobileCreate">＋<span>Create</span></button><button data-page="messages">✉<span>Chat</span></button><button data-page="profile">◎<span>Profile</span></button>
  </nav>
</section>

<div id="modal" class="modal-root hidden"></div>
<script src="/app.js" defer></script>
</body></html>
